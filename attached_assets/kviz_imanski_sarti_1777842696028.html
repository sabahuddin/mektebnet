        let selectedQuestions = [];
        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        function startQuiz() {
            const count = parseInt(document.getElementById('question-count').value);
            const shuffled = [...allQuestions].sort(() => Math.random() - 0.5);
            selectedQuestions = shuffled.slice(0, Math.min(count, allQuestions.length));
            selectedQuestions.forEach(q => {
                q.answers = [...q.answers].sort(() => Math.random() - 0.5);
            });
            document.getElementById('quiz-settings').style.display = 'none';
            document.getElementById('quiz-content').style.display = 'block';
            showQuestion();
        }

        function showQuestion() {
            if (currentQuestion >= selectedQuestions.length) {
                showResults();
                return;
            }
            answered = false;
            const q = selectedQuestions[currentQuestion];
            document.getElementById('progress-text').textContent = `Pitanje ${currentQuestion + 1} od ${selectedQuestions.length}`;
            document.getElementById('progress-fill').style.width = `${((currentQuestion + 1) / selectedQuestions.length) * 100}%`;
            document.getElementById('question-text').textContent = q.question;
            
            const answersDiv = document.getElementById('answers');
            answersDiv.innerHTML = '';
            q.answers.forEach((answer, index) => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.textContent = answer;
                btn.onclick = () => checkAnswer(index);
                answersDiv.appendChild(btn);
            });
            document.getElementById('next-btn').style.display = 'none';
        }

        function checkAnswer(selectedIndex) {
            if (answered) return;
            answered = true;
            const q = selectedQuestions[currentQuestion];
            const buttons = document.querySelectorAll('.answer-btn');
            const correctIndex = q.answers.indexOf(q.correct);
            
            buttons.forEach((btn, index) => {
                btn.classList.add('disabled');
                if (index === correctIndex) btn.classList.add('correct');
                else if (index === selectedIndex) btn.classList.add('wrong');
            });

            const isCorrect = (q.answers[selectedIndex] === q.correct);
            if (isCorrect) score++;

            const feedbackMsg = isCorrect ? "" : `Tačan odgovor je: ${q.correct}\n\nLekcija: ${q.source}`;
            
            if (window.parent && window.parent.engine) {
                window.parent.engine.showFeedbackPopup(isCorrect, feedbackMsg);
            }
            
            document.getElementById('next-btn').style.display = 'inline-block';
        }

        function nextQuestion() {
            currentQuestion++;
            showQuestion();
        }

        function showResults() {
            document.getElementById('quiz-content').style.display = 'none';
            document.getElementById('results').style.display = 'block';
            const percentage = Math.round((score / selectedQuestions.length) * 100);
            document.getElementById('final-score').textContent = `${score} / ${selectedQuestions.length} (${percentage}%)`;
            let message = percentage >= 90 ? 'Izvrsno!' : (percentage >= 60 ? 'Dobro urađeno!' : 'Pokušaj ponovo!');
            document.getElementById('result-message').textContent = message;
            spremiRezultat(score, selectedQuestions.length, 'Imanski šarti');
        }

        function spremiRezultat(bodovi, ukupno, naziv) {
            const korisnik = JSON.parse(localStorage.getItem('mektebUser') || 'null');
            if (!korisnik || !korisnik.id) return;

            fetch('https://mekteb.net/wp-json/mekteb/v1/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user_id: korisnik.id,
                    quiz: naziv,
                    score: bodovi,
                    total: ukupno,
                    time: 0
                })
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    const msg = document.getElementById('result-message');
                    if (msg) msg.textContent += ' ✓ Rezultat sačuvan!';
                }
            })
            .catch(() => {});
        }

    </script>
