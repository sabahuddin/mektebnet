openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Mekteb - Arapsko pismo API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: lessons
    description: Lesson content
  - name: progress
    description: Student progress tracking
  - name: exercises
    description: Exercise sessions
  - name: content
    description: Content (quizzes, lessons, etc.)
  - name: h5p
    description: H5P interaktivne vježbe (server-side scoring)

paths:
  /muallim/grupa/{id}/izvjestaj-statistika:
    get:
      operationId: getGroupStatisticsReport
      summary: Svih šest sekcija statistike autorizovane grupe
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - $ref: "#/components/parameters/GroupReportStudents"
        - $ref: "#/components/parameters/GroupReportFrom"
        - $ref: "#/components/parameters/GroupReportTo"
        - $ref: "#/components/parameters/GroupReportSections"
      responses:
        "200":
          description: Tekuća mektebska godina za prisustvo i ocjene, kumulativno učenje
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupStatisticsReport"
        "400":
          description: Neispravan ID grupe
        "403":
          description: Pristup grupi nije dozvoljen
        "500":
          description: Izvještaj nije moguće učitati

  /muallim/grupa/{id}/izvjestaj-excel:
    get:
      operationId: downloadGroupStatisticsExcel
      summary: Excel sa grupnim sažetkom i šest radnih listova
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - $ref: "#/components/parameters/GroupReportStudents"
        - $ref: "#/components/parameters/GroupReportFrom"
        - $ref: "#/components/parameters/GroupReportTo"
        - $ref: "#/components/parameters/GroupReportSections"
      responses:
        "200":
          description: Excel izvještaj
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "400":
          description: Neispravan ID grupe
        "403":
          description: Pristup grupi nije dozvoljen
        "500":
          description: Izvještaj nije moguće izvesti

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /lessons:
    get:
      operationId: getLessons
      tags: [lessons]
      summary: Get all lessons
      responses:
        "200":
          description: List of lessons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lesson"

  /lessons/{id}:
    get:
      operationId: getLessonById
      tags: [lessons]
      summary: Get lesson by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lesson details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /progress:
    get:
      operationId: getProgress
      tags: [progress]
      summary: Get the authenticated student's progress
      responses:
        "200":
          description: Student progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProgress"

  /progress/lesson:
    post:
      operationId: saveLessonProgress
      tags: [progress]
      summary: Save lesson completion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveLessonProgressRequest"
      responses:
        "200":
          description: Progress saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProgress"

  /exercises/session:
    post:
      operationId: saveExerciseSession
      tags: [exercises]
      summary: Save exercise session results
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExerciseSessionRequest"
      responses:
        "200":
          description: Session saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExerciseSessionResult"

  /content/kviz-rezultat:
    post:
      operationId: saveQuizResult
      tags: [content]
      summary: Save a quiz attempt and return progress delta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizResultRequest"
      responses:
        "200":
          description: Quiz attempt saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizResult"
        "429":
          description: Already attempted today
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /h5p/result:
    post:
      operationId: saveH5pResult
      tags: [h5p]
      summary: Save an H5P attempt; server computes hasanati with anti-cheat multiplier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/H5pResultRequest"
      responses:
        "200":
          description: Attempt saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/H5pResultResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Prilog not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /h5p/attempts/{priloziId}:
    get:
      operationId: getH5pAttempts
      tags: [h5p]
      summary: Get attempt history for the current user and a specific H5P prilog
      parameters:
        - name: priloziId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: History
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/H5pAttemptsResponse"

components:
  parameters:
    GroupReportStudents:
      name: ucenici
      in: query
      description: IDs razdvojeni zarezom; izostavljeno znači svi aktivni, prazno znači niko
      schema:
        type: string
    GroupReportFrom:
      name: od
      in: query
      description: Dodatno sužava samo prisustvo i ocjene u tekućoj mektebskoj godini
      schema:
        type: string
        format: date
    GroupReportTo:
      name: do
      in: query
      description: Završni datum samo za prisustvo i ocjene
      schema:
        type: string
        format: date
    GroupReportSections:
      name: sekcije
      in: query
      description: IDs sekcija razdvojeni zarezom; izostavljeno znači svih šest
      schema:
        type: string
  schemas:
    GroupReportStudent:
      type: object
      required: [id, ime]
      properties:
        id:
          type: integer
        ime:
          type: string
    GroupReportCell:
      type: [string, number, "null"]
    GroupReportMetric:
      type: object
      required: [label, value]
      properties:
        label:
          type: string
        value:
          $ref: "#/components/schemas/GroupReportCell"
    GroupReportTable:
      type: object
      required: [title, headers, rows]
      properties:
        title:
          type: string
        headers:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: array
            items:
              $ref: "#/components/schemas/GroupReportCell"
    GroupReportSection:
      type: object
      required: [id, title, summary, tables]
      properties:
        id:
          type: string
        title:
          type: string
        summary:
          type: array
          items:
            $ref: "#/components/schemas/GroupReportMetric"
        tables:
          type: array
          items:
            $ref: "#/components/schemas/GroupReportTable"
    GroupStatisticsReport:
      type: object
      required: [naslov, period, sections, ucenici]
      properties:
        naslov:
          type: string
        period:
          type: string
        ucenici:
          type: array
          items:
            $ref: "#/components/schemas/GroupReportStudent"
        sections:
          type: array
          items:
            $ref: "#/components/schemas/GroupReportSection"

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message

    Lesson:
      type: object
      properties:
        id:
          type: integer
        orderNum:
          type: integer
        slug:
          type: string
        title:
          type: string
        lessonType:
          type: string
          enum: [intro, new_content, repeat, revision, mega_revision]
        letters:
          type: array
          items:
            type: string
        durationMin:
          type: integer
        isUnlocked:
          type: boolean
        isCompleted:
          type: boolean
        hasanatEarned:
          type: integer
      required:
        - id
        - orderNum
        - slug
        - title
        - lessonType
        - letters
        - durationMin
        - isUnlocked
        - isCompleted
        - hasanatEarned

    LessonDetail:
      allOf:
        - $ref: "#/components/schemas/Lesson"
        - type: object
          properties:
            story:
              $ref: "#/components/schemas/LessonStory"
            letterData:
              type: array
              items:
                $ref: "#/components/schemas/LetterData"
            exercises:
              type: array
              items:
                $ref: "#/components/schemas/ExerciseConfig"
          required:
            - letterData
            - exercises

    LessonStory:
      type: object
      properties:
        character:
          type: string
          enum: [dzana, amir, both]
        lines:
          type: array
          items:
            type: object
            properties:
              speaker:
                type: string
              text:
                type: string
              emotion:
                type: string
            required:
              - speaker
              - text
              - emotion
      required:
        - character
        - lines

    LetterData:
      type: object
      properties:
        arabic:
          type: string
        name:
          type: string
        transliteration:
          type: string
        forms:
          type: object
          properties:
            isolated:
              type: string
            initial:
              type: string
            medial:
              type: string
            final:
              type: string
          required:
            - isolated
            - initial
            - medial
            - final
        dotCount:
          type: integer
        nonConnecting:
          type: boolean
        visualAssociation:
          type: string
        soundFile:
          type: string
      required:
        - arabic
        - name
        - transliteration
        - forms
        - dotCount
        - nonConnecting
        - visualAssociation
        - soundFile

    ExerciseConfig:
      type: object
      properties:
        type:
          type: string
          enum: [find_letter, count_dots, which_form, yes_no, listen_recognize, group_difference]
        title:
          type: string
        rounds:
          type: integer
        timeLimit:
          type: integer
        hasanatReward:
          type: integer
      required:
        - type
        - title
        - rounds
        - hasanatReward

    StudentProgress:
      type: object
      properties:
        studentId:
          type: string
        totalHasanat:
          type: integer
        completedLessons:
          type: array
          items:
            type: integer
        badges:
          type: array
          items:
            $ref: "#/components/schemas/Badge"
        streakDays:
          type: integer
        lastActivityDate:
          type: string
          format: date
      required:
        - studentId
        - totalHasanat
        - completedLessons
        - badges
        - streakDays

    Badge:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        emoji:
          type: string
        description:
          type: string
        earnedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - emoji
        - description
        - earnedAt

    SaveLessonProgressRequest:
      type: object
      properties:
        lessonId:
          type: integer
      required:
        - lessonId

    ExerciseSessionRequest:
      type: object
      properties:
        lessonId:
          type: integer
        exerciseType:
          type: string
        correctAnswers:
          type: integer
        totalQuestions:
          type: integer
        timeSpentSeconds:
          type: integer
      required:
        - lessonId
        - exerciseType
        - correctAnswers
        - totalQuestions
        - timeSpentSeconds

    ExerciseSessionResult:
      type: object
      properties:
        hasanatEarned:
          type: integer
        newBadges:
          type: array
          items:
            $ref: "#/components/schemas/Badge"
        totalHasanat:
          type: integer
        streakBonus:
          type: integer
        previousHasanat:
          type: integer
        hasanatGained:
          type: integer
        streakDays:
          type: integer
        streakIncreased:
          type: boolean
      required:
        - hasanatEarned
        - newBadges
        - totalHasanat
        - streakBonus
        - previousHasanat
        - hasanatGained
        - streakDays
        - streakIncreased


    QuizResultRequest:
      type: object
      properties:
        kvizId:
          type: integer
        kvizNaslov:
          type: string
        tacniOdgovori:
          type: integer
        ukupnoPitanja:
          type: integer
      required:
        - kvizId
        - tacniOdgovori
        - ukupnoPitanja

    QuizResult:
      type: object
      properties:
        id:
          type: integer
        kvizId:
          type: integer
        kvizNaslov:
          type: string
        tacniOdgovori:
          type: integer
        ukupnoPitanja:
          type: integer
        procenat:
          type: integer
        bodovi:
          type: integer
        hasanatEarned:
          type: integer
        hasanatGained:
          type: integer
        totalHasanat:
          type: integer
        previousHasanat:
          type: integer
        streakDays:
          type: integer
        streakIncreased:
          type: boolean
        newBadges:
          type: array
          items:
            $ref: "#/components/schemas/Badge"
      required:
        - hasanatEarned
        - hasanatGained
        - totalHasanat
        - previousHasanat
        - streakDays
        - streakIncreased
        - newBadges

    H5pResultRequest:
      type: object
      required: [priloziId, score, maxScore]
      properties:
        priloziId:
          type: integer
        score:
          type: number
        maxScore:
          type: number

    H5pResultResponse:
      type: object
      required: [attemptNo, score, maxScore, procenat, multiplier, hasanatGained, totalHasanat, previousHasanat]
      properties:
        attemptNo:
          type: integer
        score:
          type: integer
        maxScore:
          type: integer
        procenat:
          type: integer
        multiplier:
          type: number
        hasanatGained:
          type: integer
        totalHasanat:
          type: integer
        previousHasanat:
          type: integer

    H5pAttempt:
      type: object
      required: [attemptNo, score, maxScore, procenat, hasanatGained, completedAt]
      properties:
        attemptNo:
          type: integer
        score:
          type: integer
        maxScore:
          type: integer
        procenat:
          type: integer
        hasanatGained:
          type: integer
        completedAt:
          type: string
          format: date-time

    H5pAttemptsResponse:
      type: object
      required: [attempts, nextAttemptNo, nextMultiplier]
      properties:
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/H5pAttempt"
        nextAttemptNo:
          type: integer
          description: Redni broj sljedećeg pokušaja korisnika (length(attempts)+1)
        nextMultiplier:
          type: number
          description: Anti-cheat multiplier koji se primjenjuje na sljedeći pokušaj (1.0 / 0.5 / 0)
