<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Razvrstaj · Mekteb.net</title>
<!--
  RAZVRSTAJ – vježba za mekteb.net
  Jedan fajl, bez vanjskih skripti, fontova, kolačića i analitike.
  Font Nunito se učita s ove iste domene (/fonts/nunito-*.woff2).

  SADRŽAJ
    Vježba čita podatke ovim redom:
      1. window.RAZVRSTAJ_PODACI  (ako ga stranica postavi prije ove skripte)
      2. ?podaci=/putanja/do/datoteke.json  (samo s iste domene)
      3. ugrađeni primjer na dnu ovog fajla (script id="podaci")
    Nova vježba = nova JSON datoteka u podaci/. Polja:
      id          – oznaka vježbe, vraća se u događajima
      naslov      – naslov iznad kutija
      uputa       – jedna-dvije rečenice (nije obavezno)
      kategorije  – od dvije do pet kutija:
                    [{ "naziv": "Halal", "stavke": ["...", "..."] }, …]
      poredaj     – "mijesaj" (zadano) ili "redom" za ponuđene stavke

  KAKO DIJETE RJEŠAVA
    Sve stavke stoje izmiješane u ponudi. Dijete ih prevlači u kutije —
    svaka stavka se prihvata, i kad nije u pravoj kutiji. Kad razvrsta sve,
    klikne „Provjeri": tačno razvrstane pozelene i zaključaju se, ostale se
    označe crveno i dodirom se vrate u ponudu.

  DOGAĐAJI (postMessage roditelju i CustomEvent "mekteb-igra")
    visina – kad se promijeni visina sadržaja
    stavka – kad je stavka potvrđena u svojoj kutiji
    kraj   – kad je sve tačno razvrstano
             { id, pronadjeno, ukupno, sekunde, greske, pomoc, provjere, tacnoIzPrve }
-->
<style>
/* Nunito — lokalno hostan, promjenljivi rez (200–1000). Bez Google Fontsa. */
@font-face{
  font-family:'Nunito';
  src:url('/fonts/nunito-latin-ext.woff2') format('woff2');
  font-weight:200 1000;
  font-style:normal;
  font-display:swap;
  unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
}
@font-face{
  font-family:'Nunito';
  src:url('/fonts/nunito-latin.woff2') format('woff2');
  font-weight:200 1000;
  font-style:normal;
  font-display:swap;
  unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}

:root{
  --tirkiz:#248F92;
  --tirkiz-tamni:#176F72;
  --tirkiz-blijedi:#E8F3F3;
  --narandzasta:#F59E0B;
  --narandzasta-blijedo:#FDF3E0;
  --narandzasta-tamna:#8A5A00;
  --zelena:#2F7D4F;
  --zelena-blijeda:#E7F4EC;
  --crvena:#C0462A;
  --crvena-blijeda:#FBECE6;
  --crvena-tamna:#7A2E15;
  --mastilo:#1F2D38;
  --mastilo-blijedo:#5F6F76;
  --papir:#FFFFFF;
  --linija:#E6E3DB;
  --podloga:#FAF9F5;
  --sjena:0 1px 2px rgba(31,45,56,.06), 0 4px 12px rgba(31,45,56,.05);
  --r-kartica:16px;
  --r-dugme:12px;
  --font:'Nunito', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  padding:clamp(10px,2.5vw,20px);
  background:var(--podloga);
  color:var(--mastilo);
  font-family:var(--font);
  font-size:17px;
  line-height:1.5;
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* okvir vježbe: kartica platforme */
.igra{
  max-width:940px;
  margin:0 auto;
  background:var(--papir);
  border:1px solid var(--linija);
  border-radius:var(--r-kartica);
  box-shadow:var(--sjena);
  padding:clamp(16px,3.2vw,28px);
}

.glava{margin-bottom:16px}
.kicker{margin:0 0 4px;font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--tirkiz-tamni)}
.glava h1{margin:0;font-size:clamp(22px,4vw,30px);line-height:1.15;font-weight:800;letter-spacing:-.01em;color:var(--mastilo)}
.glava p.uputa{margin:6px 0 0;max-width:58ch;color:var(--mastilo-blijedo)}
.stanje{display:flex;gap:10px;margin:0;flex-wrap:wrap}
.stanje > div{
  background:var(--papir);
  border:1px solid var(--linija);
  border-radius:var(--r-kartica);
  padding:10px 16px;
  min-width:124px;
}
.stanje dt{font-size:12.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mastilo-blijedo)}
.stanje dd{margin:0;font-size:26px;font-weight:800;line-height:1.15;color:var(--tirkiz-tamni);font-variant-numeric:tabular-nums}

.stupac{display:flex;flex-direction:column;min-width:0}
.desni{gap:16px}

/* priča s prazninama */
.prica{
  background:#fff;
  border:1px solid var(--linija);
  border-radius:var(--r-kartica);
  padding:clamp(16px,2.4vw,24px);
  font-size:clamp(17px,1.4vw,19px);
  line-height:2.1;
}
.prica p{margin:0 0 14px}
.prica p:last-child{margin-bottom:0}


/* kutije (kategorije) */
.kutije{
  display:grid;gap:12px;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  align-items:start;
}
.kutija{
  display:flex;flex-direction:column;gap:8px;
  background:#fff;border:2px dashed var(--tirkiz);border-radius:var(--r-kartica);
  padding:12px;min-height:130px;
  transition:background .15s,border-color .15s,transform .12s;
}
.kutija.cilj{background:var(--tirkiz-blijedi);border-style:solid;border-color:var(--narandzasta);transform:scale(1.01)}
.kutija:focus-visible{outline:3px solid var(--narandzasta);outline-offset:2px}
.kutija h2{
  margin:0;font-size:16px;font-weight:800;color:var(--tirkiz-tamni);
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.kutija h2 .broj{
  font-size:13px;font-weight:800;color:var(--mastilo-blijedo);
  font-variant-numeric:tabular-nums;
}
.smjestene{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.kutija .prazno{margin:0;color:var(--mastilo-blijedo);font-size:14.5px;font-weight:700}

/* stavke */
.stavka{
  font:inherit;font-weight:800;font-size:16.5px;
  min-height:44px;padding:9px 16px;
  background:#fff;color:var(--mastilo);
  border:2px solid var(--linija);border-radius:var(--r-dugme);
  cursor:grab;touch-action:none;text-align:left;
  transition:border-color .15s,background .15s,transform .12s;
}
.stavka:hover{border-color:var(--tirkiz);background:var(--tirkiz-blijedi)}
.stavka:focus-visible{outline:3px solid var(--narandzasta);outline-offset:2px}
.stavka.izabrana{border-color:var(--narandzasta);background:var(--narandzasta-blijedo);transform:translateY(-2px)}
.stavka.vuce{opacity:.35}
.stavka.tacna{background:var(--zelena-blijeda);border-color:var(--zelena);color:#1E5735;cursor:default}
.stavka.netacna{
  background:var(--crvena-blijeda);border-color:var(--crvena);color:var(--crvena-tamna);
  animation:tresi .4s ease-in-out;
}
@keyframes tresi{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-5px)}
  75%{transform:translateX(5px)}
}

/* ponuda */
.ponuda h2{margin:0 0 10px;font-size:17px;font-weight:800;color:var(--tirkiz-tamni)}
.stavke{display:flex;flex-wrap:wrap;gap:10px;margin:0;padding:0;list-style:none}
.ponuda .prazno{color:var(--mastilo-blijedo);font-weight:700;margin:0}

/* stavka koja putuje ispod prsta */
.duh{
  position:fixed;z-index:9;pointer-events:none;
  font-weight:800;font-size:16.5px;padding:9px 16px;max-width:70vw;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  background:#fff;color:var(--mastilo);
  border:2px solid var(--narandzasta);border-radius:var(--r-dugme);
  box-shadow:0 8px 20px rgba(31,45,56,.18);
  transform:translate(-50%,-50%);
}

/* komande */
.komande{
  display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;
  margin-top:18px;padding-top:16px;border-top:1px solid var(--linija);
}
.dugmad{display:flex;flex-wrap:wrap;gap:10px;margin-left:auto}
.dugme{
  font:inherit;font-weight:800;font-size:15.5px;min-height:46px;padding:10px 18px;
  border-radius:var(--r-dugme);border:1.5px solid var(--linija);
  background:#fff;color:var(--tirkiz-tamni);cursor:pointer;
  transition:background .15s,border-color .15s,color .15s;
}
.dugme:hover{background:var(--tirkiz-blijedi);border-color:var(--tirkiz)}
.dugme.glavno{background:var(--narandzasta);border-color:var(--narandzasta);color:#2B1600}
.dugme.glavno:hover{background:#e08f06;border-color:#e08f06}
.dugme:focus-visible{outline:3px solid var(--narandzasta);outline-offset:2px}
.dugme:disabled{opacity:.45;cursor:default}
.dugme:disabled:hover{background:#fff;border-color:var(--linija)}

.poruka{margin:12px 2px 0;font-size:16px;font-weight:700;color:var(--mastilo-blijedo);min-height:1.6em}
.poruka.dobro{color:#1E5735}
.poruka.lose{color:#8A3A1B}

.kraj{
  margin-top:14px;
  background:var(--narandzasta-blijedo);
  border:1px solid var(--narandzasta);border-radius:var(--r-kartica);
  padding:16px 16px 18px;text-align:center;
  animation:digni .4s ease-out;
}
.kraj h2{margin:0 0 4px;font-size:20px;font-weight:800;color:var(--narandzasta-tamna)}
.kraj p{margin:0 0 12px;color:var(--mastilo-blijedo)}
@keyframes digni{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}

.greska{padding:16px;border:1px solid var(--narandzasta);border-radius:var(--r-kartica);background:var(--narandzasta-blijedo);color:var(--mastilo)}

/* Široki ekran: kutije lijevo, ponuda i dugmad desno. */
@media (min-width:900px){
  .igra{max-width:1240px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);column-gap:clamp(20px,3vw,34px);align-items:start}
  .lijevi,.desni{max-height:calc(100svh - 98px);min-height:0}
  .kutije{flex:1 1 auto;min-height:0;overflow:auto}
  .ponuda{flex:1 1 auto;min-height:0;overflow:auto}
  .komande{margin-top:auto}
}
@media (max-width:899px){
  .igra{display:flex;flex-direction:column}
  .stupac{display:contents}
  .glava{order:1}
  .stanje{order:2;margin-bottom:14px}
  .kutije{order:3}
  .poruka{order:4}
  .kraj{order:5}
  /* Na telefonu ponuda ostaje prilijepljena za dno ekrana. */
  .ponuda{
    order:6;margin-top:14px;position:sticky;bottom:0;z-index:4;
    background:var(--papir);padding:10px 0 6px;
    box-shadow:0 -12px 18px rgba(255,255,255,.9);
    max-height:38svh;overflow:auto;
  }
  .komande{order:7}
  .dugmad{margin-left:0;width:100%}
  .dugmad .dugme{flex:1 1 auto;white-space:nowrap}
}
@media (prefers-reduced-motion:reduce){
  .kraj,.stavka.netacna{animation-duration:.01s}
  .dugme,.stavka,.kutija{transition:none}
}
</style>
</head>
<body>

<main class="igra" id="igra">
  <div class="stupac lijevi" id="lijevo">
    <header class="glava">
      <p class="kicker">Mekteb.net · vježba</p>
      <h1 id="naslov">Razvrstaj</h1>
      <p class="uputa" id="uputa"></p>
    </header>

    <div class="kutije" id="kutije"></div>
    <p class="poruka" id="poruka" aria-live="polite"></p>

    <div class="kraj" id="kraj" hidden>
      <h2>Mašallah, sve je razvrstano kako treba!</h2>
      <p id="kraj-opis"></p>
      <button class="dugme glavno" id="ponovo" type="button">Pokušaj ponovo</button>
    </div>
  </div>

  <div class="stupac desni" id="desno">
    <dl class="stanje">
      <div><dt>Razvrstano</dt><dd id="brojac">0 od 0</dd></div>
      <div><dt>Vrijeme</dt><dd id="sat">0:00</dd></div>
    </dl>

    <section class="ponuda">
      <h2 id="ponuda-naslov">Stavke za razvrstavanje</h2>
      <ul class="stavke" id="ponuda"></ul>
      <p class="prazno" id="ponuda-prazna" hidden>Sve stavke su razvrstane.</p>
    </section>

    <footer class="komande" id="komande">
      <div class="dugmad">
        <button class="dugme" id="pomoc" type="button">Pomozi mi</button>
        <button class="dugme" id="nova" type="button">Počni ispočetka</button>
        <button class="dugme glavno" id="provjeri" type="button" disabled>Provjeri</button>
      </div>
    </footer>
  </div>

  <p class="sr" id="glas" aria-live="polite"></p>
</main>

<!-- Diskretni zvukovi (Web Audio, bez zvučnih datoteka). Vidi /vjezbe/zvuk.js. -->
<script src="/vjezbe/zvuk.js" defer></script>

<noscript>Za ovu vježbu treba uključiti JavaScript.</noscript>

<!-- Ugrađeni primjer. Isti oblik ima i vanjska JSON datoteka. -->
<script type="application/json" id="podaci">
{
  "id": "namaz-vrijeme",
  "naslov": "Razvrstaj: namaz i vrijeme",
  "uputa": "Prevuci svaku stavku u kutiju kojoj pripada. Kad razvrstaš sve, klikni „Provjeri\".",
  "kategorije": [
    { "naziv": "Farz-namazi", "stavke": ["sabah", "podne", "ikindija", "akšam", "jacija"] },
    { "naziv": "Dijelovi abdesta", "stavke": ["pranje lica", "pranje ruku", "potiranje glave", "pranje nogu"] }
  ]
}
</script>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var el = {
    naslov: $('naslov'), uputa: $('uputa'), brojac: $('brojac'), sat: $('sat'),
    kutije: $('kutije'), ponuda: $('ponuda'), ponudaPrazna: $('ponuda-prazna'),
    poruka: $('poruka'), glas: $('glas'),
    kraj: $('kraj'), krajOpis: $('kraj-opis'), ponovo: $('ponovo'),
    pomoc: $('pomoc'), nova: $('nova'), provjeri: $('provjeri'), desno: $('desno')
  };

  var podaci, kategorije, sveStavke, stanje;

  /* ---------- sitnice ---------- */
  function slucajan(n) { return Math.floor(Math.random() * n); }
  function promijesaj(niz) {
    for (var i = niz.length - 1; i > 0; i--) {
      var j = slucajan(i + 1), p = niz[i]; niz[i] = niz[j]; niz[j] = p;
    }
    return niz;
  }
  function vrijeme(sek) { return Math.floor(sek / 60) + ':' + String(sek % 60).padStart(2, '0'); }

  function javi(dogadjaj, detalji) {
    var poruka = Object.assign({ izvor: 'mekteb-igra', igra: 'razvrstaj', dogadjaj: dogadjaj, id: podaci && podaci.id }, detalji || {});
    try { window.parent.postMessage(poruka, '*'); } catch (g) {}
    try { window.dispatchEvent(new CustomEvent('mekteb-igra', { detail: poruka })); } catch (g) {}
  }
  function reci(tekst) { el.glas.textContent = tekst; }
  function poruci(tekst, vrsta) {
    el.poruka.textContent = tekst || '';
    el.poruka.className = 'poruka' + (vrsta ? ' ' + vrsta : '');
  }

  /* ---------- podaci ---------- */
  function ucitaj() {
    if (window.RAZVRSTAJ_PODACI) return Promise.resolve(window.RAZVRSTAJ_PODACI);
    var ugradjeni = function () { return JSON.parse($('podaci').textContent); };
    var putanja = new URLSearchParams(location.search).get('podaci');
    // Samo relativna putanja s naše domene — nikakav vanjski zahtjev.
    if (!putanja || !/^\/[^/]/.test(putanja)) return Promise.resolve(ugradjeni());
    return fetch(putanja, { credentials: 'same-origin' })
      .then(function (o) { if (!o.ok) throw new Error('HTTP ' + o.status); return o.json(); })
      .catch(function () { return ugradjeni(); });
  }

  function pripremi(p) {
    podaci = p || {};
    kategorije = Array.isArray(podaci.kategorije)
      ? podaci.kategorije
        .map(function (k) {
          return {
            naziv: String((k && k.naziv) || '').trim(),
            stavke: Array.isArray(k && k.stavke)
              ? k.stavke.map(function (s) { return String(s == null ? '' : s).trim(); }).filter(Boolean)
              : []
          };
        })
        .filter(function (k) { return k.naziv && k.stavke.length; })
      : [];

    el.naslov.textContent = podaci.naslov || 'Razvrstaj';
    document.title = (podaci.naslov ? podaci.naslov + ' · ' : '') + 'Razvrstaj · Mekteb.net';
    el.uputa.textContent = podaci.uputa || 'Prevuci svaku stavku u kutiju kojoj pripada, pa klikni „Provjeri".';
    el.uputa.hidden = !el.uputa.textContent;
  }

  function greska(tekst) {
    var p = document.createElement('p');
    p.className = 'greska'; p.textContent = tekst;
    el.kutije.replaceWith(p);
    el.poruka.hidden = true;
    el.kraj.hidden = true;
    el.desno.hidden = true;
  }

  /* ---------- nova igra ---------- */
  function novaIgra() {
    if (stanje && stanje.sat) clearInterval(stanje.sat);
    if (kategorije.length < 2) {
      greska('Za ovu vježbu trebaju najmanje dvije kutije, svaka sa bar jednom stavkom.');
      return;
    }

    stanje = {
      greske: 0, pomoc: 0, provjere: 0, izPrve: null, tacnih: 0,
      pocetak: 0, sekunde: 0, sat: null, gotovo: false,
      izabrana: null, vuce: null, duh: null, cilj: null, stavke: []
    };

    var redni = 0;
    sveStavke = [];
    kategorije.forEach(function (k, ki) {
      k.stavke.forEach(function (tekst) {
        sveStavke.push({ id: 's' + (redni++), tekst: tekst, kutija: ki, gdje: null, zakljucana: false, netacna: false });
      });
    });
    stanje.stavke = sveStavke.slice();
    if (podaci.poredaj !== 'redom') promijesaj(stanje.stavke);

    el.kraj.hidden = true;
    el.pomoc.disabled = false;
    el.provjeri.disabled = true;
    el.sat.textContent = '0:00';
    poruci('');
    nacrtaj();
    osvjeziBrojac();
  }

  /* ---------- crtanje ---------- */
  function napraviStavku(stavka) {
    var dugme = document.createElement('button');
    dugme.type = 'button';
    dugme.className = 'stavka'
      + (stavka.zakljucana ? ' tacna' : '')
      + (stavka.netacna ? ' netacna' : '')
      + (stanje.izabrana === stavka.id ? ' izabrana' : '');
    dugme.dataset.id = stavka.id;
    dugme.textContent = stavka.tekst;
    dugme.disabled = stavka.zakljucana || stanje.gotovo;
    if (stanje.izabrana === stavka.id) dugme.setAttribute('aria-pressed', 'true');
    return dugme;
  }

  function nacrtaj(fokusId) {
    var imaoFokus = fokusId && document.activeElement && document.activeElement.classList
      && document.activeElement.classList.contains('stavka');
    // kutije
    el.kutije.textContent = '';
    kategorije.forEach(function (k, ki) {
      var kutija = document.createElement('div');
      kutija.className = 'kutija';
      kutija.dataset.k = ki;
      kutija.tabIndex = 0;
      kutija.setAttribute('role', 'button');
      kutija.setAttribute('aria-label', 'Kutija ' + k.naziv + ' — ovdje smjesti izabranu stavku');

      var naslov = document.createElement('h2');
      naslov.appendChild(document.createTextNode(k.naziv));
      var broj = document.createElement('span');
      broj.className = 'broj';
      var uKutiji = stanje.stavke.filter(function (s) { return s.gdje === ki; });
      broj.textContent = uKutiji.length + '/' + k.stavke.length;
      naslov.appendChild(broj);
      kutija.appendChild(naslov);

      var spisak = document.createElement('ul');
      spisak.className = 'smjestene';
      uKutiji.forEach(function (s) {
        var li = document.createElement('li');
        li.appendChild(napraviStavku(s));
        spisak.appendChild(li);
      });
      kutija.appendChild(spisak);
      if (uKutiji.length === 0) {
        var prazno = document.createElement('p');
        prazno.className = 'prazno';
        prazno.textContent = 'Prazno';
        kutija.appendChild(prazno);
      }
      el.kutije.appendChild(kutija);
    });

    // ponuda
    el.ponuda.textContent = '';
    var uPonudi = stanje.stavke.filter(function (s) { return s.gdje === null; });
    uPonudi.forEach(function (s) {
      var li = document.createElement('li');
      li.appendChild(napraviStavku(s));
      el.ponuda.appendChild(li);
    });
    el.ponudaPrazna.hidden = uPonudi.length > 0;

    if (fokusId) {
      var novo = document.querySelector('.stavka[data-id="' + fokusId + '"]');
      if (novo && !novo.disabled && (imaoFokus || fokusId === stanje.izabrana)) {
        novo.focus({ preventScroll: true });
      }
    }
  }

  function osvjeziBrojac() {
    var razvrstano = stanje.stavke.filter(function (s) { return s.gdje !== null; }).length;
    el.brojac.textContent = razvrstano + ' od ' + stanje.stavke.length;
    // Provjera ima smisla tek kad je ponuda prazna.
    el.provjeri.disabled = stanje.gotovo || razvrstano < stanje.stavke.length;
  }

  /* ---------- sat ---------- */
  function pokreniSat() {
    if (stanje.sat || stanje.gotovo) return;
    stanje.pocetak = Date.now();
    stanje.sat = setInterval(function () {
      stanje.sekunde = Math.floor((Date.now() - stanje.pocetak) / 1000);
      el.sat.textContent = vrijeme(stanje.sekunde);
    }, 500);
  }

  /* ---------- smještanje ---------- */
  function nadji(id) {
    for (var i = 0; i < stanje.stavke.length; i++) if (stanje.stavke[i].id === id) return stanje.stavke[i];
    return null;
  }

  /** Svaka stavka ide u svaku kutiju — tačnost se provjerava na kraju. */
  function smjesti(stavka, ki) {
    if (!stavka || stavka.zakljucana || stanje.gotovo) return;
    pokreniSat();
    stavka.gdje = ki;
    stavka.netacna = false;
    stanje.izabrana = null;
    nacrtaj(stavka.id);
    osvjeziBrojac();
    if (el.provjeri.disabled === false) {
      poruci('Sve je razvrstano. Klikni „Provjeri" da vidiš kako si uradio.');
      reci('Sve je razvrstano. Klikni Provjeri.');
    } else {
      poruci('Smješteno: ' + stavka.tekst + ' → ' + kategorije[ki].naziv + '.');
      reci('Smješteno u ' + kategorije[ki].naziv);
    }
  }

  function vrati(stavka) {
    if (!stavka || stavka.zakljucana || stanje.gotovo || stavka.gdje === null) return;
    stavka.gdje = null;
    stavka.netacna = false;
    stanje.izabrana = null;
    nacrtaj(stavka.id);
    osvjeziBrojac();
    poruci('Stavka „' + stavka.tekst + '" je vraćena među ponuđene.');
    reci('Vraćeno. ' + stavka.tekst);
  }

  function oznaci(id) {
    stanje.izabrana = id;
    [].forEach.call(document.querySelectorAll('.stavka'), function (b) {
      var jeste = b.dataset.id === id;
      b.classList.toggle('izabrana', jeste);
      b.setAttribute('aria-pressed', jeste ? 'true' : 'false');
    });
  }

  /** Diskretan zvuk; ako zvuk.js nije učitan ili je ugašen, ništa se ne desi. */
  function zvuk(vrsta) {
    try { if (window.MektebZvuk && window.MektebZvuk[vrsta]) window.MektebZvuk[vrsta](); } catch (g) {}
  }

  /* ---------- provjera ---------- */
  function zakljucajTacnu(stavka) {
    stavka.zakljucana = true;
    stavka.netacna = false;
    stanje.tacnih = stanje.stavke.filter(function (s) { return s.zakljucana; }).length;
    javi('stavka', {
      stavka: stavka.tekst, kutija: kategorije[stavka.kutija].naziv,
      pronadjeno: stanje.tacnih, ukupno: stanje.stavke.length
    });
  }

  function provjeri() {
    if (!stanje || stanje.gotovo) return;
    var razvrstano = stanje.stavke.filter(function (s) { return s.gdje !== null; }).length;
    if (razvrstano < stanje.stavke.length) return;
    stanje.provjere++;

    var tacnih = 0;
    stanje.stavke.forEach(function (stavka) {
      if (stavka.zakljucana) { tacnih++; return; }
      if (stavka.gdje === stavka.kutija) {
        zakljucajTacnu(stavka);
        tacnih++;
      } else {
        stavka.netacna = true;
        stanje.greske++;
      }
    });

    stanje.tacnih = tacnih;
    if (stanje.izPrve === null) stanje.izPrve = tacnih;
    stanje.izabrana = null;
    nacrtaj();
    osvjeziBrojac();

    if (tacnih === stanje.stavke.length) { zavrsi(); return; }

    zvuk('greska');
    poruci('Tačno razvrstano: ' + tacnih + ' od ' + stanje.stavke.length +
           '. Označene stavke nisu u pravoj kutiji — dodirni ih da ih vratiš, pa probaj ponovo.', 'lose');
    reci('Tačno ' + tacnih + ' od ' + stanje.stavke.length + '. Ispravi označene stavke.');
    el.provjeri.disabled = true;
  }

  /* ---------- kraj ---------- */
  function zavrsi() {
    stanje.gotovo = true;
    zvuk('kraj');
    clearInterval(stanje.sat); stanje.sat = null;
    if (stanje.pocetak) stanje.sekunde = Math.round((Date.now() - stanje.pocetak) / 1000);
    el.sat.textContent = vrijeme(stanje.sekunde);
    el.pomoc.disabled = true;
    el.provjeri.disabled = true;
    poruci('');
    nacrtaj();

    var ukupno = stanje.stavke.length;
    var opis = 'Vrijeme: ' + vrijeme(stanje.sekunde) + '.';
    if (stanje.izPrve !== null) {
      opis += stanje.izPrve === ukupno
        ? ' Iz prve sve tačno!'
        : ' Iz prve tačno: ' + stanje.izPrve + ' od ' + ukupno + '.';
    }
    if (stanje.pomoc > 0) opis += stanje.pomoc === 1 ? ' Pomoć korištena jednom.' : ' Pomoć korištena ' + stanje.pomoc + ' puta.';
    el.krajOpis.textContent = opis;
    el.kraj.hidden = false;
    el.ponovo.focus({ preventScroll: true });
    try { el.kraj.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (g) {}

    javi('kraj', {
      pronadjeno: stanje.tacnih, ukupno: ukupno, sekunde: stanje.sekunde,
      greske: stanje.greske, pomoc: stanje.pomoc,
      provjere: stanje.provjere, tacnoIzPrve: stanje.izPrve
    });
  }

  /* ---------- miš, prst i tastatura ---------- */
  function pocniVucu(e) {
    var dugme = e.target.closest && e.target.closest('.stavka');
    if (!dugme || e.button || !stanje || stanje.gotovo) return;
    var stavka = nadji(dugme.dataset.id);
    if (!stavka || stavka.zakljucana) return;
    e.preventDefault();
    stanje.vuce = { stavka: stavka, dugme: dugme, pomjereno: false, x: e.clientX, y: e.clientY };
    try { dugme.setPointerCapture(e.pointerId); } catch (g) {}
  }
  el.ponuda.addEventListener('pointerdown', pocniVucu);
  el.kutije.addEventListener('pointerdown', pocniVucu);

  function pomjeriDuh(x, y) {
    if (!stanje.duh) {
      stanje.duh = document.createElement('div');
      stanje.duh.className = 'duh';
      stanje.duh.textContent = stanje.vuce.stavka.tekst;
      document.body.appendChild(stanje.duh);
      stanje.vuce.dugme.classList.add('vuce');
    }
    stanje.duh.style.left = x + 'px';
    stanje.duh.style.top = y + 'px';

    var ispod = document.elementFromPoint(x, y);
    var cilj = ispod && ispod.closest ? ispod.closest('.kutija') : null;
    if (!cilj && ispod && ispod.closest && ispod.closest('.ponuda')) cilj = el.ponuda;
    if (cilj !== stanje.cilj) {
      if (stanje.cilj && stanje.cilj.classList) stanje.cilj.classList.remove('cilj');
      if (cilj && cilj.classList) cilj.classList.add('cilj');
      stanje.cilj = cilj;
    }
  }

  document.addEventListener('pointermove', function (e) {
    if (!stanje || !stanje.vuce) return;
    if (!stanje.vuce.pomjereno) {
      var d = Math.abs(e.clientX - stanje.vuce.x) + Math.abs(e.clientY - stanje.vuce.y);
      if (d < 6) return;
      stanje.vuce.pomjereno = true;
    }
    e.preventDefault();
    pomjeriDuh(e.clientX, e.clientY);
  }, { passive: false });

  function pustiVucu(e) {
    if (!stanje || !stanje.vuce) return;
    var vuce = stanje.vuce;
    stanje.vuce = null;
    if (stanje.duh) { stanje.duh.remove(); stanje.duh = null; }
    vuce.dugme.classList.remove('vuce');
    var cilj = stanje.cilj;
    if (stanje.cilj && stanje.cilj.classList) stanje.cilj.classList.remove('cilj');
    stanje.cilj = null;

    if (e.type === 'pointercancel') return;
    if (!vuce.pomjereno) {
      // Dodir bez povlačenja: stavka u kutiji se vraća, stavka iz ponude se označi.
      if (vuce.stavka.gdje !== null) { vrati(vuce.stavka); return; }
      oznaci(stanje.izabrana === vuce.stavka.id ? null : vuce.stavka.id);
      poruci(stanje.izabrana ? 'Sada dodirni kutiju u koju ide „' + vuce.stavka.tekst + '".' : '');
      return;
    }
    if (!cilj) return;
    if (cilj === el.ponuda) { vrati(vuce.stavka); return; }
    smjesti(vuce.stavka, +cilj.dataset.k);
  }
  document.addEventListener('pointerup', pustiVucu);
  document.addEventListener('pointercancel', pustiVucu);

  // Tastatura: Enter na stavci je označi, Enter na kutiji je smjesti.
  function klikNaStavku(e) {
    if (!stanje || stanje.gotovo) return;
    var dugme = e.target.closest && e.target.closest('.stavka');
    if (!dugme || e.detail !== 0) return;
    var stavka = nadji(dugme.dataset.id);
    if (!stavka || stavka.zakljucana) return;
    if (stavka.gdje !== null) { vrati(stavka); return; }
    oznaci(stanje.izabrana === stavka.id ? null : stavka.id);
    poruci(stanje.izabrana ? 'Sada odaberi kutiju u koju ide „' + stavka.tekst + '".' : '');
  }
  el.ponuda.addEventListener('click', klikNaStavku);
  el.kutije.addEventListener('click', klikNaStavku);

  el.kutije.addEventListener('click', function (e) {
    if (!stanje || stanje.gotovo) return;
    if (e.target.closest && e.target.closest('.stavka')) return;
    var kutija = e.target.closest && e.target.closest('.kutija');
    if (!kutija) return;
    if (!stanje.izabrana) {
      poruci('Prvo odaberi stavku, pa je smjesti u kutiju.');
      return;
    }
    smjesti(nadji(stanje.izabrana), +kutija.dataset.k);
  });

  el.kutije.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var kutija = e.target.closest && e.target.closest('.kutija');
    if (!kutija || e.target !== kutija) return;
    e.preventDefault();
    if (!stanje || stanje.gotovo) return;
    if (!stanje.izabrana) {
      poruci('Prvo odaberi stavku, pa je smjesti u kutiju.');
      return;
    }
    smjesti(nadji(stanje.izabrana), +kutija.dataset.k);
  });

  /* ---------- komande ---------- */
  el.provjeri.addEventListener('click', provjeri);
  el.nova.addEventListener('click', novaIgra);
  el.ponovo.addEventListener('click', function () {
    novaIgra();
    var prva = el.ponuda.querySelector('.stavka');
    if (prva) prva.focus({ preventScroll: true });
  });

  el.pomoc.addEventListener('click', function () {
    if (!stanje || stanje.gotovo) return;
    // Pomoć uzima prvu stavku koja nije na svome mjestu (ili čeka u ponudi)
    // i smješta je u pravu kutiju.
    var red = stanje.stavke.filter(function (s) { return !s.zakljucana && s.gdje !== s.kutija; });
    if (red.length === 0) red = stanje.stavke.filter(function (s) { return !s.zakljucana; });
    var stavka = red[0];
    if (!stavka) return;
    stanje.pomoc++;
    pokreniSat();
    stavka.gdje = stavka.kutija;
    zakljucajTacnu(stavka);
    stanje.izabrana = null;
    nacrtaj();
    osvjeziBrojac();
    poruci('„' + stavka.tekst + '" ide u kutiju ' + kategorije[stavka.kutija].naziv + '.', 'dobro');
    reci('Pomoć. ' + stavka.tekst + ' ide u ' + kategorije[stavka.kutija].naziv);
    if (stanje.stavke.every(function (s) { return s.gdje !== null; })) provjeri();
  });

  /* ---------- visina za iframe ---------- */
  if (window.parent !== window && 'ResizeObserver' in window) {
    new ResizeObserver(function () {
      javi('visina', { visina: Math.ceil(document.documentElement.getBoundingClientRect().height) });
    }).observe(document.documentElement);
  }

  ucitaj().then(function (p) { pripremi(p); novaIgra(); })
          .catch(function () { kategorije = []; podaci = {}; novaIgra(); });
})();
</script>
</body>
</html>
