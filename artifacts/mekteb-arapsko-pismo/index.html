<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#248F8F" />
    <meta name="color-scheme" content="light" />
    <title>Mekteb — Naučimo arapsko pismo</title>

    <!-- PWA / iOS standalone webapp meta -->
    <meta name="application-name" content="Mekteb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mekteb" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Favicons + Apple touch icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/apple-touch-icon-167.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/apple-touch-icon-152.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/apple-touch-icon-120.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-P10X0MRPDG"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-P10X0MRPDG');
    </script>

    <!--
      Multi-language podrška je PRIVREMENO ISKLJUČENA (samo bosanski).
      Google Translate widget više se ne učitava. Ostavljamo defenzivni
      CSS i runtime cookie cleanup ispod jer postojeći produkcijski
      korisnici mogu imati keširan `googtrans` cookie sa npr. `/bs/en`,
      što bi bez čišćenja prikazivalo prevedeni sadržaj sve dok ne
      isteknu cookie/cache. Cleanup pokreće context/language.tsx
      odmah na mount.

      Kad budemo vraćali jezike, vrati Google Translate <script> i
      `googleTranslateElementInit` ispod (vidi git history).
    -->
    <style>
      /* Defenzivno: ako Google Translate ipak učita (stari SW cache, browser
         extension, itd.), traka i tooltip ostaju skriveni dok korisnik ne
         dobije novi build. */
      iframe.goog-te-banner-frame,
      iframe.skiptranslate,
      .goog-te-banner-frame.skiptranslate,
      .goog-te-banner-frame {
        display: none !important;
        visibility: hidden !important;
        height: 0 !important;
        border: 0 !important;
        position: absolute !important;
        top: -9999px !important;
        left: -9999px !important;
        z-index: -1 !important;
      }
      .goog-tooltip,
      .goog-tooltip:hover,
      .goog-text-highlight {
        display: none !important;
        background: transparent !important;
        box-shadow: none !important;
      }
      body {
        top: 0 !important;
        margin-top: 0 !important;
      }
      #google_translate_element {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
