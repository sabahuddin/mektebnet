<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Mekteb — Naučimo arapsko pismo</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-P10X0MRPDG"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-P10X0MRPDG');
    </script>

    <!--
      Google Translate widget — koristi se za auto-prevod sadržaja
      (lekcije, kvizovi, čitaonica) na jezik koji korisnik odabere
      u našem language pickeru. UI stringovi su preveden kroz naš
      i18n; widget pokriva ostali tekstualni sadržaj iz baze.

      Žuta Google traka i tooltip su skriveni preko CSS-a ispod;
      widget radi nevidljivo. Aktivacija ide preko googtrans cookie
      koji postavi context/language.tsx prije reloada.
    -->
    <style>
      /* Skriva žutu Google translate traku na vrhu (i sve njene artefakte). */
      iframe.goog-te-banner-frame,
      iframe.skiptranslate,
      .goog-te-banner-frame.skiptranslate,
      .goog-te-banner-frame {
        display: none !important;
        visibility: hidden !important;
        height: 0 !important;
        border: 0 !important;
        position: absolute !important;
        top: -9999px !important;
        left: -9999px !important;
        z-index: -1 !important;
      }
      .goog-tooltip,
      .goog-tooltip:hover,
      .goog-text-highlight {
        display: none !important;
        background: transparent !important;
        box-shadow: none !important;
      }
      /* Google postavlja body { top: 40px } da ostavi mjesta za traku — anuliramo,
         a NE diramo position (sticky header zavisi od default body position-a). */
      body {
        top: 0 !important;
        margin-top: 0 !important;
      }
      /* Skriveni kontejner za sam widget. */
      #google_translate_element {
        display: none !important;
        position: absolute !important;
        top: -9999px !important;
      }
    </style>
    <script type="text/javascript">
      // Fallback: Google ponekad doda traku tek nakon load-a, pa MutationObserver
      // uklanja banner i resetuje body.top kad god se pojavi.
      (function() {
        function clean() {
          document.querySelectorAll('iframe.goog-te-banner-frame, iframe.skiptranslate').forEach(function(el) {
            el.style.display = 'none';
            el.style.height = '0';
          });
          if (document.body && document.body.style.top) {
            document.body.style.top = '';
          }
        }
        if (document.addEventListener) {
          document.addEventListener('DOMContentLoaded', function() {
            clean();
            new MutationObserver(clean).observe(document.body, { childList: true, subtree: false });
          });
        }
      })();
    </script>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        // Source je bs (sav sadržaj u bazi je na bosanskom);
        // widget zna prevesti na sve naše ciljne jezike.
        new google.translate.TranslateElement({
          pageLanguage: 'bs',
          includedLanguages: 'bs,de,en,tr,ar',
          autoDisplay: false,
        }, 'google_translate_element');
      }
    </script>
    <script type="text/javascript"
      src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"
      defer></script>
  </head>
  <body>
    <div id="root"></div>
    <div id="google_translate_element" aria-hidden="true"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
